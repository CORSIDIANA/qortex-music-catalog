name: Verify catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure local development
        run: cp .env.example .env
      - name: Build, test and exercise the public API
        run: python scripts/verify.py
      - name: Install browser test dependencies
        run: |
          pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Exercise real browser flows
        run: python scripts/browser_smoke.py > .local/verification/browser.log
      - name: Capture container output
        if: always()
        run: docker compose logs --no-color > .local/verification/containers.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-output
          path: |
            .local/verification/
            .local/browser/
          include-hidden-files: true
      - name: Stop test containers
        if: always()
        run: docker compose down
